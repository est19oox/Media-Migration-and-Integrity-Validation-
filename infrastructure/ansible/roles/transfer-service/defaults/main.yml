---
transfer_service_name: transfer-service
transfer_service_image: "{{ lookup('env', 'MMIV_TRANSFER_IMAGE') | default('mmiv:transfer-service', true) }}"
transfer_service_container_port: 8081
transfer_service_host_port: 8081
transfer_service_bucket: "{{ lookup('env', 'MMIV_BUCKET_NAME') | default('media-migration-dev-landing', true) }}"
aws_region: "{{ lookup('env', 'AWS_REGION') | default('ap-southeast-1', true) }}"
ecr_registry: "{{ lookup('env', 'ECR_REGISTRY') | default('', true) }}"
