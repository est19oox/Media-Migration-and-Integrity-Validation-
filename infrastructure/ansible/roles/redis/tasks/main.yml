---
- name: Install Docker and Python HTTP support
  ansible.builtin.dnf:
    name:
      - docker
      - python3-requests
    state: present

- name: Start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Create private configuration directory
  ansible.builtin.file:
    path: /etc/mmiv
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate Redis credentials once per host
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, secrets, sys
        path = sys.argv[1]
        content = "SPRING_DATA_REDIS_HOST=redis\nSPRING_DATA_REDIS_PORT=6379\nSPRING_DATA_REDIS_PASSWORD=" + secrets.token_hex(32) + "\n"
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        with os.fdopen(fd, "w") as stream:
            stream.write(content)
      - "{{ mmiv_redis_env_file }}"
    creates: "{{ mmiv_redis_env_file }}"
  no_log: true

- name: Protect Redis environment file
  ansible.builtin.file:
    path: "{{ mmiv_redis_env_file }}"
    owner: root
    group: root
    mode: '0600'

- name: Read Redis credentials
  ansible.builtin.slurp:
    src: "{{ mmiv_redis_env_file }}"
  register: redis_environment
  no_log: true

- name: Write authenticated Redis configuration
  ansible.builtin.copy:
    dest: /etc/mmiv/redis.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      bind 0.0.0.0
      protected-mode yes
      port 6379
      dir /data
      appendonly yes
      appendfsync everysec
      maxmemory {{ mmiv_redis_maxmemory }}
      maxmemory-policy noeviction
      requirepass {{ (redis_environment.content | b64decode).split('SPRING_DATA_REDIS_PASSWORD=')[1] | trim }}
  register: redis_configuration
  no_log: true

- name: Create shared application network
  community.docker.docker_network:
    name: "{{ mmiv_docker_network }}"
    state: present

- name: Create Redis data volume
  community.docker.docker_volume:
    name: "{{ mmiv_redis_volume }}"
    state: present

- name: Start Redis without publishing its port
  community.docker.docker_container:
    name: "{{ mmiv_redis_name }}"
    image: "{{ mmiv_redis_image }}"
    state: started
    restart_policy: unless-stopped
    restart: "{{ redis_configuration.changed }}"
    memory: "{{ mmiv_redis_container_memory }}"
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    env_file: "{{ mmiv_redis_env_file }}"
    networks:
      - name: "{{ mmiv_docker_network }}"
        aliases: [redis]
    volumes:
      - "{{ mmiv_redis_volume }}:/data"
      - /etc/mmiv/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$SPRING_DATA_REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  no_log: true

- name: Verify authenticated Redis connectivity through the application network
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ mmiv_docker_network }}"
      - --env-file
      - "{{ mmiv_redis_env_file }}"
      - "{{ mmiv_redis_image }}"
      - sh
      - -c
      - 'REDISCLI_AUTH="$SPRING_DATA_REDIS_PASSWORD" redis-cli -h "$SPRING_DATA_REDIS_HOST" -p "$SPRING_DATA_REDIS_PORT" ping'
  register: redis_ping
  changed_when: false
  retries: 12
  delay: 5
  until: redis_ping.rc == 0 and redis_ping.stdout | trim == 'PONG'
  no_log: true
