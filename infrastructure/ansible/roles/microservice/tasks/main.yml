---
- name: Inspect existing service container
  community.docker.docker_container_info:
    name: "{{ microservice_name }}"
  register: service_container

- name: Reject a container belonging to another Compose project
  ansible.builtin.assert:
    that:
      - (service_container.container.Config.Labels or {}).get('com.docker.compose.project', microservice_compose_project) == microservice_compose_project
    fail_msg: "Container name is owned by another Compose project; refusing to remove it."
  when: service_container.exists

- name: Ensure service configuration directory exists
  ansible.builtin.file:
    path: "{{ microservice_compose_directory }}"
    state: directory
    mode: '0700'

- name: Deploy or roll back service
  ansible.builtin.include_tasks: "{{ 'rollback.yml' if microservice_rollback | bool else 'deploy.yml' }}"
