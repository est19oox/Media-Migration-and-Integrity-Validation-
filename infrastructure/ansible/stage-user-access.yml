---
- name: Stage immutable User Access configuration for Docker
  hosts: mmiv
  become: true
  gather_facts: false
  vars:
    mmiv_configuration_directory: /etc/mmiv
    mmiv_configuration_owner: root
    mmiv_configuration_group: root
    release_id: "{{ lookup('env', 'MMIV_RELEASE_ID') }}"
    access_settings:
      ORACLE_JDBC_URL: "{{ lookup('env', 'USER_ACCESS_DB_URL') }}"
      ORACLE_USER: "{{ lookup('env', 'USER_ACCESS_DB_USERNAME') }}"
      ORACLE_PASSWORD: "{{ lookup('env', 'USER_ACCESS_DB_PASSWORD') }}"
      JWT_ISSUER: "{{ lookup('env', 'USER_ACCESS_JWT_ISSUER') }}"
      JWT_KEY_ID: "{{ lookup('env', 'USER_ACCESS_JWT_KEY_ID') }}"
    private_key: "{{ lookup('env', 'USER_ACCESS_JWT_PRIVATE_KEY') | trim }}"
    public_key: "{{ lookup('env', 'USER_ACCESS_JWT_PUBLIC_KEY') | trim }}"
    config_id: "{{ {'settings': access_settings, 'private': private_key, 'public': public_key} | to_json(sort_keys=True) | hash('sha256') }}"
    config_directory: "{{ mmiv_configuration_directory }}/user-access/versions/{{ config_id }}"
  tasks:
    - name: Require a safe release identifier
      ansible.builtin.assert:
        that: release_id is match('^[a-zA-Z0-9-]{1,120}$')
    - name: Require complete single-line settings
      ansible.builtin.assert:
        that:
          - item.value | length > 0
          - "'\n' not in item.value"
          - "'\r' not in item.value"
      loop: "{{ access_settings | dict2items }}"
      no_log: true
    - name: Require PKCS8 private and X509 public PEM keys
      ansible.builtin.assert:
        that:
          - private_key.startswith('-----BEGIN PRIVATE KEY-----')
          - private_key.endswith('-----END PRIVATE KEY-----')
          - public_key.startswith('-----BEGIN PUBLIC KEY-----')
          - public_key.endswith('-----END PUBLIC KEY-----')
      no_log: true
    - name: Create private immutable bundle directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ mmiv_configuration_owner }}"
        group: "{{ mmiv_configuration_group }}"
        mode: '0700'
      loop:
        - "{{ mmiv_configuration_directory }}"
        - "{{ mmiv_configuration_directory }}/user-access"
        - "{{ mmiv_configuration_directory }}/user-access/versions"
        - "{{ config_directory }}"
      no_log: true
    - name: Stage database and JWT settings
      ansible.builtin.copy:
        dest: "{{ config_directory }}/environment.env"
        owner: "{{ mmiv_configuration_owner }}"
        group: "{{ mmiv_configuration_group }}"
        mode: '0600'
        force: false
        content: |
          {% for name, value in access_settings.items() %}
          {{ name }}={{ value }}
          {% endfor %}
          JWT_PRIVATE_KEY_PATH=file:/run/mmiv-jwt/private.pem
          JWT_PUBLIC_KEY_PATH=file:/run/mmiv-jwt/public.pem
      no_log: true
    - name: Stage signing keys without overwriting previous bundles
      ansible.builtin.copy:
        dest: "{{ config_directory }}/{{ item.name }}.pem"
        content: "{{ item.content }}\n"
        owner: "{{ mmiv_configuration_owner }}"
        group: "{{ mmiv_configuration_group }}"
        mode: '0600'
        force: false
      loop:
        - name: private
          content: "{{ private_key }}"
        - name: public
          content: "{{ public_key }}"
      no_log: true
    - name: Stage the release bundle identity only
      ansible.builtin.copy:
        dest: "{{ mmiv_configuration_directory }}/next-user-access-{{ release_id }}.json"
        content: "{{ {'config_id': config_id} | to_json }}\n"
        mode: '0600'
      no_log: true
