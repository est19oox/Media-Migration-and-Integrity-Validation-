- name: Prepare shared MMIV host
  hosts: mmiv
  become: true
  gather_facts: false
  vars:
    docker_compose_version: '2.40.3'
    docker_compose_checksums:
      x86_64: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372
      aarch64: d26373b19e89160546d15407516cc59f453030d9bc5b43ba7faf16f7b4980137
  pre_tasks:
    - name: Wait for SSM connectivity
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 10
    - name: Gather facts
      ansible.builtin.setup: {}
  tasks:
    - name: Ensure MMIV state directory exists
      ansible.builtin.file:
        path: /var/lib/mmiv
        state: directory
        mode: '0755'
    - name: Create media input directory
      ansible.builtin.file:
        path: /var/lib/mmiv/media
        state: directory
        mode: '0755'
    - name: Create persistent Transfer log outbox
      ansible.builtin.file:
        path: /var/lib/mmiv/transfer-log-outbox
        state: directory
        mode: '0700'
    - name: Install missing host components
      ansible.builtin.dnf:
        name:
          - docker
          - awscli
          - python3-requests
          - openssl
        state: present
    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Check installed Compose version
      ansible.builtin.command:
        argv: [docker, compose, version, --short]
      register: installed_compose
      changed_when: false
      failed_when: false
    - name: Install Compose only when missing or its pinned version changes
      when: installed_compose.rc != 0 or installed_compose.stdout | trim != docker_compose_version
      block:
        - name: Require a supported Compose architecture
          ansible.builtin.assert:
            that: ansible_facts.architecture in docker_compose_checksums
        - name: Create Docker CLI plugin directory
          ansible.builtin.file:
            path: /usr/local/lib/docker/cli-plugins
            state: directory
            mode: '0755'
        - name: Install checksum-verified Compose plugin
          ansible.builtin.get_url:
            url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-{{ ansible_facts.architecture }}"
            dest: /usr/local/lib/docker/cli-plugins/docker-compose
            checksum: "sha256:{{ docker_compose_checksums[ansible_facts.architecture] }}"
            mode: '0755'
            force: true
    - name: Ensure shared microservice network exists
      community.docker.docker_network:
        name: "{{ mmiv_docker_network }}"
        state: present
    # Redis preparation is temporarily commented out.
