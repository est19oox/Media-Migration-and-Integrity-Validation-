global:
  scrape_interval: 10s
scrape_configs:
  - job_name: service-registry
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service-registry:8761
        labels:
          service: service-registry
  - job_name: transfer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - transfer-service:8081
        labels:
          service: transfer-service
  - job_name: integrity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - integrity-service:8082
        labels:
          service: integrity-service
  - job_name: integrity-service-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - integrity-service-2:8086
        labels:
          service: integrity-service
  - job_name: user-access-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-access-service:8083
        labels:
          service: user-access-service
  - job_name: reporting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - reporting-service:8084
        labels:
          service: reporting-service
  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - discovery-service:8085
        labels:
          service: discovery-service
