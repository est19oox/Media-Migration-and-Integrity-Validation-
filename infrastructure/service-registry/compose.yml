services:
  api-gateway:
    build:
      context: ../../services/api-gateway
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      transfer-service:
        condition: service_started
      user-access-service:
        condition: service_started
      integrity-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      reporting-service:
        condition: service_started
      discovery-service:
        condition: service_started
      redis:
        condition: service_healthy
      integrity-service-2:
        condition: service_started
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      SPRING_DATA_REDIS_HOST: redis
    volumes:
    - api-gateway-events:/var/lib/mmiv/event-outbox
  service-registry:
    build:
      context: ../../services/service-registry
    ports:
    - 127.0.0.1:8761:8761
    restart: unless-stopped
    networks:
    - registry
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://localhost:8761/actuator/health
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
    volumes:
    - service-registry-events:/var/lib/mmiv/event-outbox
    depends_on:
      rabbitmq:
        condition: service_healthy
  transfer-service:
    build:
      context: ../../services/transfer-service
    ports:
    - 127.0.0.1:8081:8081
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
    volumes:
    - transfer-service-events:/var/lib/mmiv/event-outbox
    - ${DISCOVERY_MEDIA_PATH:-../../media}:/media:ro
  discovery-service:
    build:
      context: ../../services/discovery-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DISCOVERY_ROOT: ${DISCOVERY_ROOT:-/media}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
    ports:
    - 127.0.0.1:8085:8085
    volumes:
    - ${DISCOVERY_MEDIA_PATH:-../../media}:/media:ro
    - discovery-service-events:/var/lib/mmiv/event-outbox
  user-access-service:
    build:
      context: ../../services/user-access-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
    ports:
    - 127.0.0.1:8083:8083
    env_file:
    - path: ${USER_ACCESS_ENV_FILE:?Set USER_ACCESS_ENV_FILE to a private configuration
        file}
      format: raw
    volumes:
    - ${USER_ACCESS_JWT_DIRECTORY:?Set USER_ACCESS_JWT_DIRECTORY}:/run/mmiv-jwt:ro
    - user-access-service-events:/var/lib/mmiv/event-outbox
  reporting-service:
    build:
      context: ../../services/reporting-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
      MONGODB_URI: mongodb://mmiv:${MONGODB_PASSWORD:?Set MONGODB_PASSWORD}@mongodb:27017/mmiv_reporting?authSource=admin
    ports:
    - 127.0.0.1:8084:8084
    volumes:
    - reporting-service-events:/var/lib/mmiv/event-outbox
  integrity-service:
    build:
      context: ../../services/integrity-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
    ports:
    - 127.0.0.1:8082:8082
    volumes:
    - integrity-service-events:/var/lib/mmiv/event-outbox
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine@sha256:5cbd7145b0306399ad68422c3350b6cbd1bb95704b39f5896480e5b6d4238a04
    hostname: mmiv-local-rabbitmq
    restart: unless-stopped
    ports:
    - 127.0.0.1:15672:15672
    networks:
    - registry
    environment:
      RABBITMQ_DEFAULT_USER: mmiv
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
    - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  mongodb:
    image: mongo:8.0.14-noble@sha256:877fa303326645cd0e50a3833fce2f3c03d6eb4aac82c97a02e98879f51126d3
    restart: unless-stopped
    networks:
    - registry
    environment:
      MONGO_INITDB_ROOT_USERNAME: mmiv
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD}
    volumes:
    - mongo-data:/data/db
    healthcheck:
      test:
      - CMD-SHELL
      - mongosh --quiet --username mmiv --password "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok?0:1)'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    networks:
    - registry
    mem_limit: 128m
    command:
    - redis-server
    - --maxmemory
    - 64mb
    - --maxmemory-policy
    - noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 10
  integrity-service-2:
    build:
      context: ../../services/integrity-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mmiv
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      MMIV_EVENTS_ENABLED: 'true'
      MMIV_EVENTS_OUTBOX_DIRECTORY: /var/lib/mmiv/event-outbox
      METADATA_URL: http://discovery-service
      USER_ACCESS_URL: http://user-access-service
      USER_ACCESS_JWK_SET_URI: http://user-access-service/.well-known/jwks.json
      USER_ACCESS_JWT_ISSUER: ${USER_ACCESS_JWT_ISSUER:-https://auth.mmiv.example}
      SERVER_PORT: '8086'
    ports:
    - 127.0.0.1:8086:8086
    volumes:
    - integrity-service-2-events:/var/lib/mmiv/event-outbox
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    networks:
    - registry
    ports:
    - 127.0.0.1:9090:9090
    mem_limit: 256m
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=512MB
    volumes:
    - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
networks:
  registry: null
volumes:
  api-gateway-events: {}
  service-registry-events: {}
  transfer-service-events: {}
  discovery-service-events: {}
  user-access-service-events: {}
  reporting-service-events: {}
  integrity-service-events: {}
  rabbit-data: {}
  mongo-data: {}
  integrity-service-2-events: {}
  prometheus-data: {}
