services:
  api-gateway:
    build:
      context: ../../services/api-gateway
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      transfer-service:
        condition: service_started
      user-access-service:
        condition: service_started
      reporting-service:
        condition: service_started
      integrity-service:
        condition: service_started
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  service-registry:
    build:
      context: ../../services/service-registry
    ports:
    - 127.0.0.1:8761:8761
    restart: unless-stopped
    networks:
    - registry
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://localhost:8761/actuator/health
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  transfer-service:
    build:
      context: ../../services/transfer-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  discovery-service:
    build:
      context: ../../services/discovery-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DISCOVERY_ROOT: ${DISCOVERY_ROOT:-/media}
    profiles:
    - discovery
    volumes:
    - ${DISCOVERY_MEDIA_PATH:-../../media}:/media:ro
  user-access-service:
    build:
      context: ../../services/user-access-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
  reporting-service:
    build:
      context: ../../services/reporting-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-mmiv}:${MONGO_ROOT_PASSWORD:-mmiv-local}@mongodb:27017/mmiv_reporting?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-mmiv}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-mmiv-local}
  integrity-service:
    build:
      context: ../../services/integrity-service
    restart: unless-stopped
    networks:
    - registry
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka/
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      MMIV_BUCKET_NAME: ${MMIV_BUCKET_NAME:-media-migration-dev-landing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  mongodb:
    image: mongo:8.0.14-noble
    restart: unless-stopped
    networks:
    - registry
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-mmiv}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mmiv-local}
    volumes:
    - mongo-data:/data/db
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    restart: unless-stopped
    networks:
    - registry
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mmiv}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-mmiv-local}
    volumes:
    - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
networks:
  registry: null
volumes:
  mongo-data:
  rabbit-data:
