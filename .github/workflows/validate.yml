name: PR validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: PR validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Repository validation
        run: sh scripts/ci/validate-repository.sh .

      - name: Maven build and unit tests
        run: sh scripts/ci/run-tests.sh .

      - name: Surefire test validation
        shell: bash
        run: |
          set -euo pipefail
          reports=$(find services -type f -path '*/target/surefire-reports/TEST-*.xml' -print -quit)
          test -n "$reports"
          echo "Surefire reports found."

      - name: Set up Python tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Semgrep and Checkov
        run: |
          python -m pip install --disable-pip-version-check \
            semgrep==1.136.0 \
            checkov==3.2.300

      - name: Semgrep SAST
        run: sh scripts/ci/run-sast.sh .

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: 0.59.1

      - name: Trivy SCA
        run: sh scripts/ci/run-sca.sh .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: Terraform fmt, init, and validate
        run: sh scripts/ci/run-terraform-checks.sh .

      - name: Checkov IaC scan
        run: sh scripts/ci/run-iac-scan.sh .

      - name: Ansible syntax check
        working-directory: infrastructure/ansible
        run: |
          python -m pip install --disable-pip-version-check \
            ansible==11.2.0 boto3==1.37.27 botocore==1.37.27
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory/ci.ini playbook.yml --syntax-check
          ansible-playbook -i inventory/ci.ini rollback.yml --syntax-check

      - name: Docker build
        run: sh scripts/ci/build-image.sh .

      - name: Upload CI reports and evidence
        if: ${{ always() }}
        env:
          MMIV_BUILD_RESULT: ${{ job.status }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          sh scripts/ci/collect-evidence.sh

      - name: Publish CI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .ci/reports/**
            services/**/target/surefire-reports/**
