name: Verify Secondary Apply Role

on:
  push:
    branches:
      - feature/secondary-ec2-isolated
    paths:
      - '.github/workflows/verify-secondary-apply-role.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: secondary-ec2-apply
    steps:
      - name: Check configured role
        env:
          ROLE_ARN: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
        run: test -n "$ROLE_ARN"
      - name: Assume secondary role using environment OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Confirm AWS identity only
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
