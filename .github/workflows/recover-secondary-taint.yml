name: Recover Secondary Terraform Taint (No Apply)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type UNTAINT-SECONDARY to repair the two known resources"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmiv-secondary-terraform-state
  cancel-in-progress: false

jobs:
  recover:
    if: inputs.confirmation == 'UNTAINT-SECONDARY'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/secondary-ec2
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_primary_instance_id: i-0674efed441197be5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/secondary-ec2-isolated
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Authenticate dedicated secondary role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Initialize isolated state
        run: terraform init -reconfigure -input=false
      - name: Verify state resource IDs and taint
        run: |
          terraform state pull | python3 -c '
          import json,sys
          s=json.load(sys.stdin)
          expected={
            ("aws_subnet","secondary"):"subnet-0d68b2148991159a9",
            ("aws_security_group","secondary"):"sg-0a4e4fda408f8c29b",
            ("aws_route_table","secondary"):"rtb-00ade47bcc026acfc",
          }
          managed={(r["type"],r["name"]):r for r in s.get("resources",[]) if r.get("mode")=="managed"}
          if set(managed)!=set(expected):
              sys.exit("Unexpected managed resources; refusing state change")
          for key,want in expected.items():
              instances=managed[key].get("instances",[])
              if len(instances)!=1 or instances[0].get("attributes",{}).get("id")!=want:
                  sys.exit("Unexpected resource ID for "+str(key))
              status=instances[0].get("status","")
              if key[0] in ("aws_subnet","aws_security_group") and status!="tainted":
                  sys.exit("Expected tainted state for "+str(key)+", got "+repr(status))
          print("Verified exact IDs and tainted statuses; safe to untaint known resources.")
          '
      - name: Remove taint only
        run: |
          terraform untaint aws_subnet.secondary
          terraform untaint aws_security_group.secondary
      - name: Generate recovery plan (no apply)
        run: terraform plan -input=false -lock-timeout=60s -out=recovery.tfplan
      - name: Reject replacement or deletion
        run: |
          terraform show -json recovery.tfplan | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          allowed={
            "aws_subnet.secondary":{("update",),("no-op",)},
            "aws_security_group.secondary":{("update",),("no-op",)},
            "aws_route_table.secondary":{("no-op",)},
            "aws_route_table_association.secondary":{("create",)},
            "aws_instance.secondary":{("create",)},
          }
          changes={x["address"]:tuple(x["change"]["actions"]) for x in p.get("resource_changes",[])}
          for name,actions in changes.items():
              if name not in allowed or actions not in allowed[name]:
                  sys.exit("Unsafe recovery plan: "+name+" "+repr(actions))
          for required in ("aws_instance.secondary","aws_route_table_association.secondary"):
              if changes.get(required)!=("create",):
                  sys.exit("Missing expected creation: "+required)
          for name,actions in sorted(changes.items()): print(name,actions)
          print("PASS: no destroy or replacement. No apply performed.")
          '
