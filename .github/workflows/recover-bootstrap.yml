name: Recover bootstrap state

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmiv-production
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/bootstrap

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-Terraform
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Install AWS SDK
        run: python -m pip install --upgrade "boto3>=1.35.0" "botocore>=1.35.0"

      - name: Initialize bootstrap remote state
        run: terraform init -input=false

      - name: Import existing bootstrap resources
        run: python ../../scripts/bootstrap/recover-state.py

      - name: Show recovered resource addresses
        run: terraform state list

      - name: Plan bootstrap updates without applying
        run: terraform plan -input=false -no-color