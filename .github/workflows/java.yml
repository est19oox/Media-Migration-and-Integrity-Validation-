name: Java CI

on:
  push:
    branches:
      - feature/github-action
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/java.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build and Test
        run: mvn --batch-mode clean verify