name: Diagnose Secondary Apply OIDC

on:
  push:
    branches:
      - feature/secondary-ec2-isolated
    paths:
      - '.github/workflows/diagnose-secondary-apply-oidc.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: secondary-ec2-apply
    steps:
      - name: Display selected non-secret OIDC identity claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += ("&" if "?" in url else "?") + "audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for field in ("aud", "sub", "repository", "repository_id", "ref", "environment"):
              if field in claims:
                  print(field + ": " + str(claims[field]))
          PY
