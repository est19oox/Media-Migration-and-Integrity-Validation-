name: Verify MMIV App OIDC Access

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-app-oidc.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with MMIV application role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-App
          aws-region: ap-southeast-1
      - name: Verify caller identity only
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
