name: Verify Secondary AWS OIDC

on:
  push:
    branches:
      - feature/secondary-ec2-isolated
    paths:
      - '.github/workflows/verify-secondary-oidc.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm role variable is configured
        env:
          ROLE_ARN: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
        run: test -n "$ROLE_ARN" || { echo "::error::Missing SECONDARY_TERRAFORM_ROLE_ARN"; exit 1; }
      - name: Authenticate using dedicated secondary role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Verify AWS identity (read-only)
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
