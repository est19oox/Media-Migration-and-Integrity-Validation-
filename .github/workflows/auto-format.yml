name: Changed-file formatting

# Formats only files changed by the pushed commits. Automatic commits are disabled unless the
# repository variable MMIV_AUTO_FORMAT_COMMIT is exactly 'true'; otherwise the workflow only checks.
# When enabled: format changed files -> commit as github-actions[bot] -> dispatch validate.yml
# (Semgrep, Trivy, Checkov, Maven tests, Docker build) on the new commit and wait for the result.
on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: changed-file-formatting-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-changed-files:
    if: github.event.repository.fork == false && vars.MMIV_AUTO_FORMAT_COMMIT != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out pushed branch without persisted credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install pinned Prettier
        run: npm ci --ignore-scripts

      - name: Check changed files only
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/format/format-changed.mjs --check --before "$BEFORE_SHA" --after "$AFTER_SHA"

  format-and-commit:
    if: >-
      github.event.repository.fork == false &&
      vars.MMIV_AUTO_FORMAT_COMMIT == 'true' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      new_sha: ${{ steps.push.outputs.new_sha }}
    env:
      BRANCH_NAME: ${{ github.ref_name }}
      BEFORE_SHA: ${{ github.event.before }}
      AFTER_SHA: ${{ github.sha }}
    steps:
      - name: Validate internal branch
        run: |
          set -euo pipefail
          case "$BRANCH_NAME" in
            main|master|release|release/*|releases/*) echo '::error::Refusing to format protected branches.'; exit 1 ;;
            feature/*|fix/*|chore/*) ;;
            *) echo '::error::Branch is not an approved internal branch.'; exit 1 ;;
          esac
          if ! printf '%s' "$BRANCH_NAME" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo '::error::Unsafe branch name.'; exit 1
          fi

      - name: Check out pushed commit without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install pinned Prettier
        run: npm ci --ignore-scripts

      - name: Format changed files only
        run: node scripts/format/format-changed.mjs --write --before "$BEFORE_SHA" --after "$AFTER_SHA" --report .ci/format-report.json

      - name: Verify changed files on the formatted tree
        run: |
          set -euo pipefail
          node scripts/format/format-changed.mjs --check --before "$BEFORE_SHA" --after "$AFTER_SHA"
          git diff --cached --check

      - name: Test affected services and static page contracts on the formatted tree
        run: |
          set -euo pipefail
          for service in $(jq -r '.javaServices[]' .ci/format-report.json); do
            mvn --batch-mode --no-transfer-progress --file "services/$service/pom.xml" clean verify
          done
          node --test tests/ci/test-upload-page.cjs tests/ci/test-admin-page.cjs tests/ci/test-transfer-auth-pages.cjs

      - name: Commit formatting-only changes
        id: commit
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --no-gpg-sign -m 'style: format changed files'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push without overwriting concurrent updates
        id: push
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote="https://github.com/${REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          current="$(git -c http.extraheader="$auth" ls-remote "$remote" "refs/heads/${BRANCH_NAME}" | cut -f1)"
          if [ "$current" != "$AFTER_SHA" ]; then
            echo '::error::Remote branch changed during formatting; aborting without pushing.'
            exit 1
          fi
          git -c http.extraheader="$auth" push --no-force "$remote" "HEAD:refs/heads/${BRANCH_NAME}"
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A GITHUB_TOKEN push does not start push or pull_request workflows, so the bot commit would
  # otherwise skip validate.yml. workflow_dispatch is the documented exception: dispatching it on
  # the branch creates a run whose head SHA is the bot commit, so its checks appear on the PR.
  # validate.yml is unchanged and runs exactly as it does for a developer commit.
  validate-final-commit:
    needs: format-and-commit
    if: needs.format-and-commit.outputs.new_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH_NAME: ${{ github.ref_name }}
      NEW_SHA: ${{ needs.format-and-commit.outputs.new_sha }}
    steps:
      - name: Dispatch full validation for the formatted commit and wait for it
        run: |
          set -euo pipefail
          printf '%s' "$NEW_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo '::error::Bad SHA.'; exit 1; }
          printf '%s' "$BRANCH_NAME" | grep -Eq '^(feature|fix|chore)/[A-Za-z0-9._/-]+$' || { echo '::error::Bad branch.'; exit 1; }
          tip="$(gh api "repos/${GH_REPO}/git/ref/heads/${BRANCH_NAME}" --jq .object.sha)"
          if [ "$tip" != "$NEW_SHA" ]; then
            echo '::error::Branch moved after the formatting commit; not dispatching validation for a different SHA.'
            exit 1
          fi
          gh workflow run validate.yml --ref "$BRANCH_NAME"
          run_id=''
          for _ in $(seq 1 30); do
            sleep 10
            run_id="$(gh run list --workflow validate.yml --branch "$BRANCH_NAME" --event workflow_dispatch \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"${NEW_SHA}\") | .databaseId" | head -n1)"
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo '::error::Validation run for the formatted commit did not start.'; exit 1; }
          echo "Validation run: https://github.com/${GH_REPO}/actions/runs/${run_id}"
          gh run watch "$run_id" --exit-status
