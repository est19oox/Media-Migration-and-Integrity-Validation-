name: Microservice CI/CD

on:
  push:
    branches:
      - feature/aws-setup
      - feature/github-action
    paths:
      - 'services/transfer-service/**'
      - 'services/integrity-service/**'
      - 'services/user-access-service/**'
      - 'services/reporting-service/**'
      - 'services/discovery-service/**'
      - 'infrastructure/ansible/**'
      - 'scripts/cd/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Microservice to deploy'
        required: true
        default: transfer-service
        type: choice
        options:
          - transfer-service
          # - integrity-service
          # - user-access-service
          # - reporting-service
          # - discovery-service

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: mmiv
  TRANSFER_SERVICE_BUCKET: media-migration-dev-landing

jobs:
  transfer-service:
    # Transfer Service is the active implementation of the generic process.
    # Future services should be enabled using the same job/template once implemented.
    if: github.event_name == 'push' || github.event.inputs.service == 'transfer-service'
    uses: ./.github/workflows/microservice-cd.yml
    with:
      service_name: transfer-service
      service_path: services/transfer-service
      container_name: transfer-service
      container_port: 8081
      host_port: 8081
      health_path: /actuator/health
      ecr_repository: mmiv
      bucket_name: media-migration-dev-landing
      run_dast: true
    secrets: inherit

  # Future microservices use exactly the same build -> ECR -> Ansible/SSM -> health -> DAST -> rollback process.
