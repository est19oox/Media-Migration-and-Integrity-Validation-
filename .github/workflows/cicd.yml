name: MMIV Microservices CI/CD

on:
  push:
    branches:
      - main
      - transfer-service
    paths:
      - 'services/**'
      - 'infrastructure/bootstrap/**'
      - 'infrastructure/terraform/**'
      - 'infrastructure/ansible/**'
      - 'scripts/cd/**'
      - '.github/workflows/cicd.yml'
      - '.github/workflows/deploy-service.yml'
  workflow_dispatch:

concurrency:
  group: mmiv-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: mmiv
  MMIV_BUCKET_NAME: media-migration-dev-landing

