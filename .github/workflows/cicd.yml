  quality_gates:
    name: CI and Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Install Semgrep and Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==1.138.0" "checkov==3.2.489"

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: cf1e32ec8d4d8823e023096a28cadb14f5b5123ce03f201fb633c5b76aa712dd
        run: |
          PACKAGE="trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          curl -fsSLo "/tmp/${PACKAGE}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${PACKAGE}"
          echo "${TRIVY_SHA256}  /tmp/${PACKAGE}" | sha256sum --check --strict
          sudo apt-get install --yes "/tmp/${PACKAGE}"

      - name: Verify CI tools
        run: |
          java -version
          mvn --version
          terraform version
          semgrep --version
          trivy --version
          checkov --version

      - name: Validate repository
        run: bash scripts/ci/validate-repository.sh .

      - name: Build and test services
        run: bash scripts/ci/run-tests.sh .

      - name: Run Semgrep SAST
        run: bash scripts/ci/run-sast.sh .

      - name: Run Trivy SCA
        run: bash scripts/ci/run-sca.sh .

      - name: Validate Terraform
        run: bash scripts/ci/run-terraform-checks.sh .

      - name: Run Checkov IaC scan
        run: bash scripts/ci/run-iac-scan.sh .

      - name: Validate Ansible
        working-directory: infrastructure/ansible
        run: |
          python -m pip install ansible boto3 botocore
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory/ci.ini playbook.yml --syntax-check
          ansible-playbook -i inventory/ci.ini rollback.yml --syntax-check
          ansible-playbook -i inventory/ci.ini redis.yml --syntax-check

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: main-ci-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            .ci/reports/**
            **/target/surefire-reports/**
  terraform:
#    needs: [bootstrap]
    name: Terraform CI/CD
    needs: [quality_gates]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-Terraform
          aws-region: ap-southeast-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init

      # CI
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Render Terraform plan
        run: terraform show -no-color tfplan > terraform-plan.txt

      # CD
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terraform-plan-${{ github.sha }}
          if-no-files-found: warn
          path: infrastructure/terraform/terraform-plan.txt

