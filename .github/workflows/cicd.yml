name: Transfer Service CI/CD

on:
  push:
    branches:
      - feature/aws-setup
      - feature/github-action
    paths:
      - "services/transfer-service/**"
      - "infrastructure/ansible/**"
      - "scripts/cd/**"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-deploy:
    name: Build, Test and Deploy Transfer Service
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: mmiv
      TRANSFER_SERVICE_BUCKET: media-migration-dev-landing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build and Test Transfer Service
        working-directory: services/transfer-service
        run: mvn -B clean verify

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-App
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Transfer Service Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f services/transfer-service/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            services/transfer-service

      - name: Push Transfer Service Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Discover EC2 Instance
        id: deployment
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=MMIV-EC2" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running MMIV-EC2 instance was found."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Found EC2 instance: $INSTANCE_ID"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml

      - name: Generate SSM Ansible Inventory
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
          SSM_BUCKET: ${{ env.TRANSFER_SERVICE_BUCKET }}
        run: |
          envsubst < infrastructure/ansible/inventory/ci.ini \
            > infrastructure/ansible/inventory/ci.generated.ini

      - name: Deploy Transfer Service with Ansible over SSM
        working-directory: infrastructure/ansible
        env:
          MMIV_TRANSFER_IMAGE: ${{ steps.login-ecr.outputs.registry }}/mmiv:${{ github.sha }}
          MMIV_BUCKET_NAME: ${{ env.TRANSFER_SERVICE_BUCKET }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          ansible-playbook \
            -i inventory/ci.generated.ini \
            playbook.yml

      - name: Smoke Test Transfer Service
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: ./scripts/cd/smoke-test-transfer.sh
