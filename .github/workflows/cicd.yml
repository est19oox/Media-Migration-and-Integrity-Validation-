name: MMIV Microservices CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'infrastructure/terraform/**'
      - 'infrastructure/ansible/**'
      - 'scripts/cd/**'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

concurrency:
  group: mmiv-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: mmiv
  MMIV_BUCKET_NAME: media-migration-dev-landing

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-Terraform
          aws-region: ap-southeast-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init

      # CI
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # CD
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

  deploy:
    name: ${{ matrix.service.name }} CI/CD
    needs: [terraform]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: transfer-service
            path: services/transfer-service
            port: '8081'
          - name: integrity-service
            path: services/integrity-service
            port: '8085'
          - name: user-access-service
            path: services/user-access-service
            port: '8083'
          - name: reporting-service
            path: services/reporting-service
            port: '8084'
          - name: discovery-service
            path: services/discovery-service
            port: '8082'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service.path }}
        run: mvn -B clean verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-App
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS connection
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ matrix.service.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            -f "${{ matrix.service.path }}/Dockerfile" \
            -t "$IMAGE" \
            "${{ matrix.service.path }}"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Discover EC2 instance
        id: deployment
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              'Name=tag:Name,Values=MMIV-EC2' \
              'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != "None"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Install Session Manager plugin
        run: |
          curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade ansible "boto3>=1.35.0" "botocore>=1.35.0"
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml

      - name: Generate SSM inventory
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
          SSM_BUCKET: ${{ env.MMIV_BUCKET_NAME }}
        run: |
          sed \
            -e "s|__INSTANCE_ID__|$INSTANCE_ID|g" \
            -e "s|__SSM_BUCKET__|$SSM_BUCKET|g" \
            infrastructure/ansible/inventory/ci.ini \
            > infrastructure/ansible/inventory/ci.generated.ini

      - name: Deploy with Ansible over SSM
        id: ansible_deploy
        working-directory: infrastructure/ansible
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          SERVICE_IMAGE: ${{ steps.image.outputs.image }}
          ECR_REGISTRY: ${{ steps.image.outputs.registry }}
          MMIV_BUCKET_NAME: ${{ env.MMIV_BUCKET_NAME }}
          CONTAINER_PORT: ${{ matrix.service.port }}
          HOST_PORT: ${{ matrix.service.port }}
        run: |
          ansible-playbook \
            -i inventory/ci.generated.ini \
            playbook.yml \
            -e "microservice_name=$SERVICE_NAME" \
            -e "microservice_image=$SERVICE_IMAGE" \
            -e "microservice_container_port=$CONTAINER_PORT" \
            -e "microservice_host_port=$HOST_PORT" \
            -e "microservice_health_path=/actuator/health" \
            -e "microservice_bucket=$MMIV_BUCKET_NAME" \
            -e "ecr_registry=$ECR_REGISTRY"

      - name: Health check
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
          SERVICE_NAME: ${{ matrix.service.name }}
          SMOKE_PORT: ${{ matrix.service.port }}
        run: bash ./scripts/cd/smoke-test-service.sh

      - name: Run DAST
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
          DAST_PORT: ${{ matrix.service.port }}
          DAST_PATH: /
        run: bash ./scripts/cd/run-dast-ssm.sh

      - name: Roll back after failure
        if: ${{ failure() && steps.ansible_deploy.outcome == 'success' }}
        working-directory: infrastructure/ansible
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          CONTAINER_PORT: ${{ matrix.service.port }}
          HOST_PORT: ${{ matrix.service.port }}
          ECR_REGISTRY: ${{ steps.image.outputs.registry }}
          MMIV_BUCKET_NAME: ${{ env.MMIV_BUCKET_NAME }}
        run: |
          ansible-playbook \
            -i inventory/ci.generated.ini \
            rollback.yml \
            -e "microservice_name=$SERVICE_NAME" \
            -e "microservice_container_port=$CONTAINER_PORT" \
            -e "microservice_host_port=$HOST_PORT" \
            -e "microservice_health_path=/actuator/health" \
            -e "microservice_bucket=$MMIV_BUCKET_NAME" \
            -e "ecr_registry=$ECR_REGISTRY"

      - name: Final smoke test
        if: success()
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
          SERVICE_NAME: ${{ matrix.service.name }}
          SMOKE_PORT: ${{ matrix.service.port }}
        run: bash ./scripts/cd/smoke-test-service.sh
