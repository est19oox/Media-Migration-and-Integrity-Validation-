  terraform-validation:
    name: Validate Terraform on an isolated runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - name: Check Terraform provider-cache behavior
        run: python3 tests/ci/test-terraform-cache.py
      - name: Validate all Terraform roots with a shared provider cache
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/mmiv-terraform-provider-cache
        run: |
          df -h "$GITHUB_WORKSPACE"
          bash scripts/ci/run-terraform-checks.sh .
          df -h "$GITHUB_WORKSPACE"

  quality_gates:
    name: CI and Security Gates
    needs: [terraform-validation]
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: ci-oracle-admin-only
          APP_USER: USER_ACCESS
          APP_USER_PASSWORD: ci-access-only
        ports:
          - 1521:1521
        options: >-
          --memory 3g
          --memory-swap 3g
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 90
          --health-start-period 180s
          --log-opt max-size=10m
          --log-opt max-file=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install isolated Semgrep and Checkov
        run: |
          set -euo pipefail
          SEMGREP_ENV="$RUNNER_TEMP/mmiv-semgrep"
          CHECKOV_ENV="$RUNNER_TEMP/mmiv-checkov"
          SCANNER_BIN="$RUNNER_TEMP/mmiv-scanner-bin"
          python -m venv "$SEMGREP_ENV"
          python -m venv "$CHECKOV_ENV"
          "$SEMGREP_ENV/bin/python" -m pip install --no-cache-dir --upgrade pip
          "$CHECKOV_ENV/bin/python" -m pip install --no-cache-dir --upgrade pip
          # MCP 1.12.2 (pinned by Semgrep) uses a Pydantic API removed in 2.14.
          "$SEMGREP_ENV/bin/python" -m pip install --no-cache-dir "semgrep==1.138.0" "pydantic==2.13.5"
          "$CHECKOV_ENV/bin/python" -m pip install --no-cache-dir "checkov==3.2.489"
          "$SEMGREP_ENV/bin/python" -m pip check
          "$CHECKOV_ENV/bin/python" -m pip check
          "$SEMGREP_ENV/bin/python" -c "from mcp.server.fastmcp import FastMCP"
          "$SEMGREP_ENV/bin/semgrep" --version
          "$CHECKOV_ENV/bin/checkov" --version
          # Expose only scanner commands, preserving setup-python for Ansible.
          mkdir -p "$SCANNER_BIN"
          printf '#!/usr/bin/env bash\nexec "%s/bin/semgrep" "$@"\n' "$SEMGREP_ENV" > "$SCANNER_BIN/semgrep"
          printf '#!/usr/bin/env bash\nexec "%s/bin/checkov" "$@"\n' "$CHECKOV_ENV" > "$SCANNER_BIN/checkov"
          chmod +x "$SCANNER_BIN/semgrep" "$SCANNER_BIN/checkov"
          echo "$SCANNER_BIN" >> "$GITHUB_PATH"

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: cf1e32ec8d4d8823e023096a28cadb14f5b5123ce03f201fb633c5b76aa712dd
        run: |
          PACKAGE="trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          curl -fsSLo "/tmp/${PACKAGE}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${PACKAGE}"
          echo "${TRIVY_SHA256}  /tmp/${PACKAGE}" | sha256sum --check --strict
          sudo apt-get install --yes "/tmp/${PACKAGE}"
          rm -f "/tmp/${PACKAGE}"

      - name: Verify CI tools
        run: |
          java -version
          mvn --version
          semgrep --version
          trivy --version
          checkov --version

      - name: Validate repository
        run: bash scripts/ci/validate-repository.sh .

      - name: Check CD dependency order and upload page
        run: |
          python3 -m pip install PyYAML
          python3 tests/ci/test-verification-login.py
          python3 tests/ci/test-runtime-config.py
          python3 tests/ci/test-cd-contract.py
          python3 tests/ci/test-terraform-sqs-policy.py
          python3 tests/ci/test-verification-permission.py
          python3 tests/ci/test-stack-lifecycle.py
          node --test tests/ci/test-upload-page.cjs tests/ci/test-transfer-auth-pages.cjs tests/ci/test-session-recovery.cjs

      - name: Reclaim and verify User Access Oracle database storage
        env:
          ORACLE_CONTAINER: ${{ job.services.oracle.id }}
        run: python3 tests/ci/test-oracle-storage.py

      - name: Build and test services including Oracle integration
        env:
          MMIV_USER_ACCESS_ORACLE_IT: 'true'
          ORACLE_PASSWORD: ci-access-only
          ORACLE_JDBC_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          ORACLE_USER: USER_ACCESS
        run: bash scripts/ci/run-tests.sh .

      - name: Run Semgrep SAST
        run: bash scripts/ci/run-sast.sh .

      - name: Run Trivy SCA
        run: bash scripts/ci/run-sca.sh .

      - name: Run Checkov IaC scan
        run: bash scripts/ci/run-iac-scan.sh .

      - name: Validate Ansible
        working-directory: infrastructure/ansible
        run: |
          python -m pip install "ansible-core==2.19.14" requests boto3 botocore
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory/ci.ini playbook.yml --syntax-check
          ansible-playbook -i inventory/ci.ini rollback.yml --syntax-check
          ansible-playbook -i inventory/ci.ini setup-host.yml --syntax-check
          ansible-playbook -i inventory/ci.ini stage-integrity.yml --syntax-check
          ansible-playbook -i inventory/ci.ini stage-user-access.yml --syntax-check
          python ../../tests/ci/test-access-config.py
          python ../../tests/ci/test-deployment-config.py
          python ../../tests/ci/test-compose-runtime.py

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: main-ci-evidence-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .ci/reports/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
  terraform:
#    needs: [bootstrap]
    name: Terraform CI/CD
    needs: [quality_gates]
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.instance.outputs.instance_id }}
      log_queue_url: ${{ steps.instance.outputs.log_queue_url }}

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-Terraform
          aws-region: ap-southeast-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Ensure Terraform role can provision MMIV log queues
        run: python3 ../../scripts/cd/ensure-terraform-sqs-policy.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init

      # CI
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Adopt an existing EC2 instance if absent from state
        run: bash ../../scripts/cd/adopt-existing-ec2.sh

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Refuse EC2 deletion or replacement
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json tfplan | python3 ../../scripts/cd/check-ec2-plan.py

      - name: Render Terraform plan
        run: terraform show -no-color tfplan > terraform-plan.txt

      # CD
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Reuse the Terraform-managed EC2 instance
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID=$(terraform output -raw mmiv_instance_id)
          STATUS=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$STATUS" = stopping ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATUS=stopped
          fi
          if [ "$STATUS" = stopped ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "log_queue_url=$(terraform output -raw file_log_queue_url)" >> "$GITHUB_OUTPUT"

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terraform-plan-${{ github.sha }}
          if-no-files-found: warn
          path: infrastructure/terraform/terraform-plan.txt

  setup-host:
    name: Prepare shared EC2 host
    needs:
      - terraform
      - build-images
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.deployment.outputs.instance_id }}
      log_queue_url: ${{ needs.terraform.outputs.log_queue_url }}
      managed_user_access_oracle: ${{ steps.runtime.outputs.managed_user_access_oracle }}
      oracle_config_staged: ${{ steps.oracle_config.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-App
          aws-region: ${{ env.AWS_REGION }}
      - name: Use the Terraform-managed EC2 instance
        id: deployment
        env:
          INSTANCE_ID: ${{ needs.terraform.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != "None"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
      - name: Load optional external runtime configuration
        id: runtime
        env:
          MMIV_RUNTIME_CONFIG: ${{ secrets.MMIV_RUNTIME_CONFIG }}
        run: python3 scripts/cd/load-runtime-config.py deployment
      - name: Wait for SSM and host initialization
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
        run: bash ./scripts/cd/wait-for-ssm.sh
      - name: Install Session Manager plugin
        run: |
          if ! command -v session-manager-plugin >/dev/null 2>&1; then
            curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb
            sudo dpkg -i /tmp/session-manager-plugin.deb
          fi
          session-manager-plugin --version
      - name: Install Ansible
        run: |
          python -m pip install "ansible-core==2.19.14" requests "boto3>=1.35.0" "botocore>=1.35.0"
          ansible-galaxy collection install -r infrastructure/ansible/requirements.yml
      - name: Generate SSM inventory
        env:
          INSTANCE_ID: ${{ steps.deployment.outputs.instance_id }}
          SSM_BUCKET: ${{ env.MMIV_BUCKET_NAME }}
        run: |
          sed \
            -e "s|__INSTANCE_ID__|$INSTANCE_ID|g" \
            -e "s|__SSM_BUCKET__|$SSM_BUCKET|g" \
            infrastructure/ansible/inventory/ci.ini \
            > infrastructure/ansible/inventory/ci.generated.ini
      - name: Prepare shared EC2 host
        working-directory: infrastructure/ansible
        run: ansible-playbook -i inventory/ci.generated.ini setup-host.yml
      - name: Stage optional Oracle configuration
        id: oracle_config
        if: ${{ env.ORACLE_CONFIG_REQUESTED == 'true' }}
        working-directory: infrastructure/ansible
        env:
          MMIV_RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: ansible-playbook -i inventory/ci.generated.ini stage-integrity.yml
      - name: Stage User Access database settings and signing keys
        if: ${{ env.MANAGED_USER_ACCESS_ORACLE != 'true' }}
        working-directory: infrastructure/ansible
        env:
          MMIV_RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          USER_ACCESS_JWT_ISSUER: ${{ vars.USER_ACCESS_JWT_ISSUER || 'https://auth.mmiv.example' }}
          USER_ACCESS_JWT_KEY_ID: ${{ vars.USER_ACCESS_JWT_KEY_ID || 'mmiv-user-access-key-1' }}
        run: ansible-playbook -i inventory/ci.generated.ini stage-user-access.yml
  build-images:
    name: Build and scan release images
    needs: [quality_gates]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        service:
          - name: service-registry
            path: services/service-registry
            port: '8761'
          - name: transfer-service
            path: services/transfer-service
            port: '8081'
          - name: integrity-service
            path: services/integrity-service
            port: '8082'
          - name: user-access-service
            path: services/user-access-service
            port: '8083'
          - name: reporting-service
            path: services/reporting-service
            port: '8084'
          - name: discovery-service
            path: services/discovery-service
            port: '8085'
          - name: api-gateway
            path: services/api-gateway
            port: '8080'
    uses: ./.github/workflows/build-service.yml
    with:
      service-name: ${{ matrix.service.name }}
      service-path: ${{ matrix.service.path }}
      service-port: ${{ matrix.service.port }}
  deploy-stack:
    name: Deploy complete Docker release
    needs: [setup-host, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-App
          aws-region: ${{ env.AWS_REGION }}
      - name: Install workflow parser
        run: python3 -m pip install PyYAML
      - name: Download release images
        uses: actions/download-artifact@v6
        with:
          pattern: release-image-*-${{ github.sha }}
          path: .ci/images
          merge-multiple: true
      - name: Prepare and deploy release in one SSM command
        env:
          INSTANCE_ID: ${{ needs.setup-host.outputs.instance_id }}
          ORACLE_CONFIG_STAGED: ${{ needs.setup-host.outputs.oracle_config_staged }}
          MANAGED_USER_ACCESS_ORACLE: ${{ needs.setup-host.outputs.managed_user_access_oracle }}
          USER_ACCESS_JWT_ISSUER: ${{ vars.USER_ACCESS_JWT_ISSUER || 'https://auth.mmiv.example' }}
          USER_ACCESS_JWT_KEY_ID: ${{ vars.USER_ACCESS_JWT_KEY_ID || 'mmiv-user-access-key-1' }}
        run: |
          python3 scripts/cd/docker-stack-ssm.py prepare
          python3 scripts/cd/docker-stack-ssm.py deploy
      - name: Upload release state
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: release-state-${{ github.sha }}
          path: .ci/deployments/release.json
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
      - name: Upload release deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: release-deployment-evidence-${{ github.sha }}
          path: .ci/reports/docker/**
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
  verify-services:
    name: Functional tests and DAST after complete release
    needs: [setup-host, deploy-stack]
    if: ${{ always() && !cancelled() && needs.setup-host.result == 'success' }}
    uses: ./.github/workflows/verify-services.yml
    with:
      instance-id: ${{ needs.setup-host.outputs.instance_id }}
      deployment-ready: ${{ needs.deploy-stack.result == 'success' }}
    secrets: inherit
