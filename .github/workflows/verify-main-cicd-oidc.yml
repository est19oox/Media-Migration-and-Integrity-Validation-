name: Verify MMIV CI/CD AWS OIDC (No Deployment)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-terraform-role:
    runs-on: ubuntu-latest
    steps:
      - name: Require Terraform role ARN
        env:
          ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
        run: test -n "$ROLE_ARN" || { echo "::error::TERRAFORM_ROLE_ARN is not set"; exit 1; }
      - name: Authenticate Terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Verify identity
        run: aws sts get-caller-identity

  verify-app-role:
    runs-on: ubuntu-latest
    steps:
      - name: Require App role ARN
        env:
          ROLE_ARN: ${{ vars.APP_ROLE_ARN }}
        run: test -n "$ROLE_ARN" || { echo "::error::APP_ROLE_ARN is not set"; exit 1; }
      - name: Authenticate App role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APP_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Verify identity
        run: aws sts get-caller-identity
