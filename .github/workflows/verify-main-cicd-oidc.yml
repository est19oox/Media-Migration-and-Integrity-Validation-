name: Verify MMIV CI/CD AWS OIDC (No Deployment)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-terraform-role:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-Terraform
          aws-region: ap-southeast-1
      - name: Verify identity
        run: aws sts get-caller-identity

  verify-app-role:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate App role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::275069781906:role/GitHubActions-MMIV-App
          aws-region: ap-southeast-1
      - name: Verify identity
        run: aws sts get-caller-identity
