name: Secondary EC2 Infrastructure (isolated)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose plan (read-only) or apply (creates billable AWS resources)"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      primary_instance_id:
        description: "Existing MMIV primary EC2 instance ID"
        type: string
        required: true
      confirmation:
        description: "For apply, enter PROVISION-SECONDARY-EC2"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: mmiv-secondary-terraform-state
  cancel-in-progress: false

jobs:
  plan:
    if: inputs.operation == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/secondary-ec2
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_primary_instance_id: ${{ inputs.primary_instance_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Validate without AWS access
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate -no-color
      - name: Require separately configured OIDC role
        env:
          ROLE_ARN: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
        run: test -n "$ROLE_ARN" || { echo "::error::Set SECONDARY_TERRAFORM_ROLE_ARN repository variable"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Initialize isolated remote state
        run: terraform init -input=false -reconfigure
      - name: Generate plan without apply
        run: terraform plan -input=false -lock-timeout=60s -out=secondary.tfplan
      - name: Verify secondary-only network plan (no apply)
        run: |
          terraform show -json secondary.tfplan | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          changes={x["address"]:x["change"]["actions"] for x in p.get("resource_changes",[]) if x["change"]["actions"]!=["no-op"]}
          if any(a!="aws_security_group.secondary" or v!=["update"] for a,v in changes.items()):
              sys.exit("Unexpected infrastructure changes: "+repr(changes))
          print("PASS: only secondary security-group in-place update or no changes.",changes)
          print("No apply performed.")
          '

  apply:
    if: inputs.operation == 'apply' && inputs.confirmation == 'PROVISION-SECONDARY-EC2'
    runs-on: ubuntu-latest
    environment: secondary-ec2-apply
    defaults:
      run:
        working-directory: infrastructure/secondary-ec2
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_primary_instance_id: ${{ inputs.primary_instance_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Validate without AWS access
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate -no-color
      - name: Require separately configured OIDC role
        env:
          ROLE_ARN: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
        run: test -n "$ROLE_ARN" || { echo "::error::Set SECONDARY_TERRAFORM_ROLE_ARN repository variable"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SECONDARY_TERRAFORM_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Initialize isolated remote state
        run: terraform init -input=false -reconfigure
      - name: Generate fresh locked plan
        run: terraform plan -input=false -lock-timeout=60s -out=secondary.tfplan
      - name: Verify narrowly scoped partial-apply recovery plan
        run: |
          terraform show -json secondary.tfplan | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          allowed={
            "aws_subnet.secondary":{("update",)},
            "aws_security_group.secondary":{("update",)},
            "aws_route_table.secondary":{("no-op",)},
            "aws_route_table_association.secondary":{("create",)},
            "aws_instance.secondary":{("create",)},
          }
          changes={x["address"]:tuple(x["change"]["actions"]) for x in p.get("resource_changes",[])}
          for address,actions in changes.items():
              if address not in allowed or actions not in allowed[address]:
                  sys.exit(f"Unsafe recovery plan: {address} {actions}")
          required={"aws_subnet.secondary","aws_security_group.secondary","aws_route_table_association.secondary","aws_instance.secondary"}
          if not required.issubset(changes):
              sys.exit("Missing expected recovery actions")
          for address in sorted(changes): print("RECOVERY PLAN:",address,changes[address])
          print("PASS: only approved secondary recovery actions. Apply allowed.")
          '
      - name: Apply exactly the reviewed plan
        run: terraform apply -input=false -auto-approve secondary.tfplan
      - name: Show secondary instance ID
        run: terraform output -raw secondary_instance_id
