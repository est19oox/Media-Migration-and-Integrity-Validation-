jenkins:
  systemMessage: "MMIV local Jenkins managed by configuration as code."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer:
    standard: {}

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      multibranchPipelineJob('mmiv-ci') {
        description('MMIV GitHub branch CI: build, test, and security validation')
        branchSources {
          git {
            id('mmiv-github-heads')
            remote('https://github.com/est19oox/Media-Migration-and-Integrity-Validation-.git')
            includes('*')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
      }
