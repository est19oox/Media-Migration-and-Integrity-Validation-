# Security Quality Gate Policy
# Sprint 0 DevSecOps foundation

quality_gates:

  sast:
    tool: semgrep
    enabled: true
    fail_on:
      - ERROR

  dependency_scanning:
    tool: dependency-check
    enabled: true
    fail_on_cvss: 7.0

  container_scanning:
    tool: trivy
    enabled: true
    fail_on:
      - HIGH
      - CRITICAL

  iac_scanning:
    tool: checkov
    enabled: true
    policy: review_failed_checks

policy:
  block_on_critical_findings: true
  require_security_review: true
