<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Change password · MMIV</title>
<style>:root{font:16px/1.5 system-ui,sans-serif;background:#f3f6fa;color:#172335}*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100dvh;display:grid;place-items:center}main{width:min(480px,100%);background:white;border:1px solid #dfe6ef;border-radius:16px;padding:24px}label{display:block;margin:16px 0 6px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #b9c6d8;border-radius:8px}button{background:#245bcb;color:white;border:0;margin-top:20px;cursor:pointer}a{color:#245bcb}#status{overflow-wrap:anywhere}</style></head><body><main><h1>Change your password</h1><p>Your administrator-issued link expires after one hour and can be used once.</p><form id="resetForm"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" required><button id="submit">Change password</button></form><p id="status" role="status"></p><a href="/login.html">Back to sign in</a></main>
<script src="/feedback.js"></script><script src="/english-validation.js"></script><script>
'use strict';let token=new URLSearchParams(location.hash.slice(1)).get('reset');history.replaceState(null,'',location.pathname);
if(!token||!/^[0-9a-f]{64}$/.test(token)){document.getElementById('submit').disabled=true;document.getElementById('status').textContent='Invalid reset link. Ask your administrator for a new link.';mmivFeedback.notice('Invalid reset link',document.getElementById('status').textContent,'error');}
document.getElementById('resetForm').addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value,button=document.getElementById('submit'),status=document.getElementById('status');
 if(password.length<8||new TextEncoder().encode(password).length>72||!password.trim()){mmivFeedback.notice('Check your password','Use at least 8 characters and no more than 72 UTF-8 bytes.','error');return;}
 if(password!==document.getElementById('confirm').value){mmivFeedback.notice('Passwords do not match','Enter the same new password in both fields.','error');return;}
 button.disabled=true;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);
 try{const url=location.port==='8083'?'/api/auth/password-reset':'/user-access/api/auth/password-reset';const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password}),cache:'no-store',credentials:'omit',signal:controller.signal});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not change password. Ask your administrator for a new link.');token=null;document.getElementById('password').value='';document.getElementById('confirm').value='';status.textContent=data.message;mmivFeedback.notice('Password changed',data.message,'success',()=>location.assign('/login.html'));}
 catch(error){status.textContent=error.name==='AbortError'?'Request timed out. Try signing in with your new password before retrying.':error.message;mmivFeedback.notice('Password change unsuccessful',status.textContent,'error');button.disabled=false;}
 finally{clearTimeout(timeout);}
});
</script></body></html>
