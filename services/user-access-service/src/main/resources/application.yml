server:
  port: 8083

spring:
  application:
    name: user-access-service

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${ORACLE_USER:USER_ACCESS}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  private-key: ${JWT_PRIVATE_KEY_PATH}
  public-key: ${JWT_PUBLIC_KEY_PATH}