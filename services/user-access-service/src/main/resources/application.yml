server:
  port: ${SERVER_PORT:8083}
spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  application:
    name: user-access-service
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USER:USER_ACCESS}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
jwt:
  issuer: ${JWT_ISSUER:https://auth.mmiv.example}
  key-id: ${JWT_KEY_ID:mmiv-user-access-key-1}
  private-key: ${JWT_PRIVATE_KEY_PATH:}
  public-key: ${JWT_PUBLIC_KEY_PATH:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# All services publish through the shared durable RabbitMQ outbox.
mmiv.events.enabled: ${MMIV_EVENTS_ENABLED:true}
mmiv.events.outbox-directory: ${MMIV_EVENTS_OUTBOX_DIRECTORY:./.mmiv-outbox}

# Managed EC2 deployments inject a host-generated password through the private environment bundle.
mmiv.bootstrap-admin.enabled: ${MMIV_BOOTSTRAP_ADMIN_ENABLED:false}
mmiv.bootstrap-admin.username: ${MMIV_BOOTSTRAP_ADMIN_USERNAME:admin}
mmiv.bootstrap-admin.password: ${MMIV_BOOTSTRAP_ADMIN_PASSWORD:}
