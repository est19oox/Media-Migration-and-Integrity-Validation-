server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
spring:
  application:
    name: reporting-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/mmiv_reporting}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
mmiv:
  reporting:
    exchange-name: ${REPORTING_EXCHANGE:mmiv.events}
    queue-name: ${REPORTING_QUEUE:reporting.events}
    dead-letter-exchange: ${REPORTING_DLX:mmiv.events.dlx}
    dead-letter-queue: ${REPORTING_DLQ:reporting.events.dlq}
    retry-attempts: ${REPORTING_RETRY_ATTEMPTS:3}
    retry-initial-delay: ${REPORTING_RETRY_INITIAL_DELAY:500ms}
    migration-timeout: ${REPORTING_MIGRATION_TIMEOUT:30m}
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# All services publish through the shared durable RabbitMQ outbox.
mmiv.events.enabled: ${MMIV_EVENTS_ENABLED:true}
mmiv.events.outbox-directory: ${MMIV_EVENTS_OUTBOX_DIRECTORY:./.mmiv-outbox}

mmiv.auth.issuer: ${USER_ACCESS_JWT_ISSUER:https://auth.mmiv.example}
mmiv.auth.jwk-set-uri: ${USER_ACCESS_JWK_SET_URI:http://user-access-service:8083/.well-known/jwks.json}
mmiv.metadata.url: ${METADATA_URL:http://discovery-service:8085}
mmiv.access.url: ${USER_ACCESS_URL:http://user-access-service:8083}
