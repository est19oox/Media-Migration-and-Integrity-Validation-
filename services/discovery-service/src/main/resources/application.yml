
server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: discovery-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# Bearer tokens are issued by the User Access Service. This service only
# verifies them, using that service's published JWKS endpoint. The issuer
# default matches the User Access Service configuration.
jwt:
  issuer: ${JWT_ISSUER:https://auth.mmiv.example}
  jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8083/.well-known/jwks.json}

discovery:
  root: ${DISCOVERY_ROOT}
  run-on-startup: false
  manifest-path: ${DISCOVERY_MANIFEST_PATH:}
  supported-file-types:
    - MP4
    - PDF
    - MP3
    - PPT
    - PPTX
    - PNG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
