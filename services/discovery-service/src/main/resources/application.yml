
server:
  port: 8085

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

discovery:
  root: ${DISCOVERY_ROOT}
  run-on-startup: false
  manifest-path: ${DISCOVERY_MANIFEST_PATH:}
  supported-file-types:
    - MP4
    - PDF
    - MP3
    - PPT
    - PPTX
    - PNG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
