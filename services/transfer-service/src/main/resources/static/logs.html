<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log dashboard · MMIV</title><link rel="stylesheet" href="/portal.css"></head><body>
<header><strong>MMIV</strong><nav><a href="/home.html">Home</a><a href="/upload.html" data-upload hidden>Upload</a><a href="/files.html" data-read hidden>Files</a><a href="/admin.html" data-admin hidden>Administration</a></nav><button id="logout" type="button">Sign out</button></header>
<main><h1>Log dashboard</h1><p>View activity for a permitted folder. Administrators can also view system logs.</p><label for="folder">Folder</label><select id="folder"></select><button id="refresh">Refresh</button><p id="status" role="status"></p><section><div class="scroll"><table><thead><tr><th>Time</th><th>Service / event</th><th>Details</th></tr></thead><tbody id="entries"></tbody></table></div><button id="previous">Previous</button><button id="next">Next</button></section></main>
<script src="/auth.js"></script><script src="/portal.js"></script><script>
let page=0, generation=0;
async function load(){const request=++generation;const folder=document.getElementById('folder').value;try{
 const data=await mmivPortal.api('/logs?page='+page+(folder?'&folder='+encodeURIComponent(folder):''));if(request!==generation)return;
 const table=document.getElementById('entries');table.replaceChildren();const rows=data.logs||data.events||[];
 for(const entry of rows){const row=document.createElement('tr');for(const value of [entry.occurredAt||entry.timestamp||'',entry.sourceService||entry.service||entry.serviceName||entry.eventType||entry.operation||entry.type||'',JSON.stringify(entry.data||entry.payload||{})]){const cell=document.createElement('td');cell.textContent=typeof value==='object'?JSON.stringify(value):value;row.append(cell);}table.append(row);}
 document.getElementById('status').textContent=rows.length?'':'No activity on this page.';document.getElementById('previous').disabled=page===0;document.getElementById('next').disabled=folder?!data.hasMore:rows.length<100;
}catch(error){if(request===generation){document.getElementById('entries').replaceChildren();document.getElementById('status').textContent=error.message;}}}
mmivPortal.profile.then(user=>{const select=document.getElementById('folder');if(user.role==='ADMIN')mmivPortal.option(select,'','System logs');for(const f of user.destinations)mmivPortal.option(select,f.destination,f.destination);if(!select.options.length){document.getElementById('status').textContent='No access to folder';document.getElementById('refresh').disabled=true;return;}load();}).catch(()=>{});
document.getElementById('folder').addEventListener('change',()=>{page=0;load();});document.getElementById('refresh').addEventListener('click',load);document.getElementById('previous').addEventListener('click',()=>{if(page>0){page--;load();}});document.getElementById('next').addEventListener('click',()=>{page++;load();});
</script></body></html>
