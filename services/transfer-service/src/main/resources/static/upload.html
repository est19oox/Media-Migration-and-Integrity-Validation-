<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMIV 文件上传</title>
<style>
body{font:16px system-ui;max-width:680px;margin:60px auto;padding:24px;background:#f4f6fa;color:#162033}
main{background:white;padding:32px;border-radius:16px}button{padding:12px 24px;background:#225be0;color:white;border:0;border-radius:8px;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;margin:16px 0;color:#566174}
</style>
<main>
<button id="logout" type="button" style="float:right">退出登录 / Sign out</button>
<h1>上传文件到云</h1>
<p>选择电脑上的文件，由 Transfer Service 上传到 Amazon S3。</p>
<label for="destination">上传目的地 / Destination</label>
<select id="destination" required><option value="">正在读取权限…</option></select>
<p id="destinationStatus" role="status"></p>
<form id="uploadForm">
<label for="file">选择文件</label>
<input id="file" name="file" type="file" accept=".png,.jpg,.jpeg,.mp4,.mp3,.txt,.pdf,.ppt,.pptx,.doc,.docx" required>
<small>支持 PNG、JPG、JPEG、MP4、MP3、TXT、PDF、PPT、PPTX、DOC、DOCX，最大 100 MiB。</small>
<button id="submit" type="submit">上传</button>
</form>
<hr>
<h2>上传文件夹（包括子文件夹）</h2>
<form id="folderForm">
<label for="folder">选择本地文件夹</label>
<input id="folder" type="file" webkitdirectory multiple required>
<small>保留文件夹路径。最多 500 个文件，总计 100 MiB；支持 PNG、JPG、JPEG、MP4、MP3、TXT、PDF、PPT、PPTX、DOC、DOCX。空文件和空文件夹不支持。部分失败时，请查看每个文件的结果。</small>
<button id="folderSubmit" type="submit">上传文件夹</button>
</form>
<pre id="folderResult" role="status" aria-live="polite"></pre>
<pre id="result" role="status" aria-live="polite"></pre>
<p id="links" hidden><a id="preview" target="_blank" rel="noopener">查看文件</a> · <a id="download">下载文件</a> · <a href="/files.html">打开文件查看页面</a></p>
</main>
<script src="/auth.js"></script>
<script>
async function loadDestinations() {
  const select = document.querySelector('#destination');
  document.querySelector('#submit').disabled = true;
  document.querySelector('#folderSubmit').disabled = true;
  try {
    const response = await mmivAuth.fetch('/api/v1/destinations');
    if (!response.ok) throw new Error('您没有此目的地的上传权限，请联系管理员。');
    const data = await response.json(); select.replaceChildren();
    for (const destination of data.destinations) {
      const option = document.createElement('option'); option.value = destination.destination;
      option.textContent = destination.destination; select.append(option);
    }
    document.querySelector('#submit').disabled = select.options.length === 0;
    document.querySelector('#folderSubmit').disabled = select.options.length === 0;
  } catch (error) {document.querySelector('#destinationStatus').textContent = error.message;}
}
loadDestinations();
document.querySelector('#uploadForm').addEventListener('submit', async event => {
  event.preventDefault();
  const file = document.querySelector('#file').files[0];
  const result = document.querySelector('#result');
  const button = document.querySelector('#submit');
  document.querySelector('#links').hidden = true;
  if (!file || file.size === 0 || file.size > 104857600) {
    result.textContent = '请选择非空且不超过 100 MiB 的文件。'; return;
  }
  const body = new FormData(); body.append('file', file);
  body.append('destinationId', document.querySelector('#destination').value);
  button.disabled = true; result.textContent = '正在上传……';
  try {
    const response = await mmivAuth.fetch('/api/v1/transfers', {method: 'POST', body});
    const text = await response.text();
    let data; try { data = JSON.parse(text); } catch { throw new Error('服务器未返回有效 JSON，HTTP ' + response.status); }
    if (!response.ok) throw new Error(data.error || '上传失败，HTTP ' + response.status);
    result.textContent = (data.success ? '传输成功，完整性验证通过' : data.cleanupStatus === 'DELETED' ? '传输未通过验证，已删除上传文件' : '传输未通过验证，自动删除未确认，请手动处理') + '\n' + JSON.stringify(data, null, 2);
    const id = encodeURIComponent(data.fileId);
    document.querySelector('#preview').href = '/api/v1/files/' + id + '/content';
    document.querySelector('#download').href = '/api/v1/files/' + id + '/download';
    document.querySelector('#links').hidden = !data.success;
  } catch (error) { result.textContent = error.message; }
  finally { button.disabled = false; }
});
document.querySelector('#folderForm').addEventListener('submit', async event => {
  event.preventDefault();
  const files = Array.from(document.querySelector('#folder').files);
  const result = document.querySelector('#folderResult');
  const button = document.querySelector('#folderSubmit');
  if (!files.length || files.length > 500 || files.reduce((n, f) => n + f.size, 0) > 104857600) {
    result.textContent = '请选择包含 1–500 个文件且总计不超过 100 MiB 的文件夹。'; return;
  }
  const body = new FormData();
  body.append('destinationId', document.querySelector('#destination').value);
  for (const file of files) {
    if (!file.webkitRelativePath || !file.size || !/\.(png|jpe?g|mp4|txt|pdf|pptx?|docx?)$/i.test(file.name)) {
      result.textContent = '文件为空或类型不支持：' + (file.webkitRelativePath || file.name); return;
    }
    body.append('files', file, file.name);
    body.append('relativePaths', file.webkitRelativePath);
  }
  button.disabled = true; result.textContent = '正在上传文件夹……';
  try {
    const response = await mmivAuth.fetch('/api/v1/transfers/folder', {method: 'POST', body});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '上传失败，HTTP ' + response.status);
    result.textContent = '完整性验证通过：' + data.succeeded + '，失败或未确认：' + data.failed + '\n' + JSON.stringify(data, null, 2);
  } catch (error) { result.textContent = error.message; }
  finally { button.disabled = false; }
});
</script>
</html>
