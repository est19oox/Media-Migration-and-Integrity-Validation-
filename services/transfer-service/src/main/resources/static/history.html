<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My activity · MMIV</title>
    <link rel="stylesheet" href="/portal.css" />
    <!-- PWA disabled: <link rel="manifest" href="/manifest.webmanifest"> -->
    <!-- PWA disabled: <meta name="theme-color" content="#14233b"> -->
    <!-- PWA disabled: <script src="/pwa.js" defer></script> -->
  </head>
  <body>
    <header>
      <strong>MMIV</strong>
      <nav>
        <a href="/home.html">Home</a><a href="/upload.html" data-upload hidden>Upload</a
        ><a href="/files.html" data-read hidden>Files</a
        ><a href="/logs.html" data-admin hidden>Log dashboard</a
        ><a href="/admin.html" data-admin hidden>Administration</a>
      </nav>
      <button id="logout" type="button">Sign out</button>
    </header>
    <main>
      <h1>My activity</h1>
      <p>
        Your own file uploads, downloads and deletions. Activity may take a few seconds to appear.
      </p>
      <button id="refresh">Refresh</button>
      <p id="status" role="status"></p>
      <section>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Action</th>
                <th>Folder</th>
                <th>File</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="entries"></tbody>
          </table>
        </div>
        <button id="previous">Previous</button><button id="next">Next</button>
      </section>
    </main>
    <script src="/feedback.js"></script>
    <script src="/auth.js"></script>
    <script src="/portal.js"></script>
    <script>
      let page = 0,
        generation = 0;
      async function load() {
        const current = ++generation;
        try {
          const data = await mmivPortal.api('/history?page=' + page);
          if (current !== generation) return;
          const table = document.getElementById('entries');
          table.replaceChildren();
          for (const entry of data.entries) {
            const row = document.createElement('tr');
            for (const value of [
              new Date(entry.time).toLocaleString('en-GB'),
              entry.action,
              entry.folder || '—',
              entry.fileName || '—',
              entry.status,
            ]) {
              const cell = document.createElement('td');
              cell.textContent = value;
              row.append(cell);
            }
            table.append(row);
          }
          document.getElementById('status').textContent = data.entries.length
            ? ''
            : 'No activity on this page.';
          document.getElementById('previous').disabled = page === 0;
          document.getElementById('next').disabled = !data.hasMore;
        } catch (error) {
          if (current === generation) {
            document.getElementById('entries').replaceChildren();
            document.getElementById('status').textContent = error.message;
          }
        }
      }
      document.getElementById('refresh').addEventListener('click', load);
      document.getElementById('previous').addEventListener('click', () => {
        if (page) {
          page--;
          load();
        }
      });
      document.getElementById('next').addEventListener('click', () => {
        page++;
        load();
      });
      load();
    </script>
    <script src="/english-validation.js"></script>
  </body>
</html>
