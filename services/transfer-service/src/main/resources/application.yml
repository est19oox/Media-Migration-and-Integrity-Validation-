server:
  port: ${SERVER_PORT:8081}
  tomcat:
    max-part-count: 1100 # Up to 500 files plus 500 relativePaths fields.

spring:
  application:
    name: transfer-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
      file-size-threshold: 0B
  # Future: uncomment after adding Spring Cloud dependencies and client classes.
  # cloud:
  #   openfeign:
  #     client:
  #       config:
  #         integrity-service:
  #           connectTimeout: 3000
  #           readTimeout: 30000

aws:
  region: ${AWS_REGION:ap-southeast-1}

mmiv:
  upload:
    max-size-bytes: 104857600
    folder:
      max-total-bytes: 104857600
      max-files: 500
  media:
    root: ${MMIV_MEDIA_ROOT:/media}
  s3:
    bucket: ${MMIV_BUCKET_NAME:media-migration-dev-landing}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
