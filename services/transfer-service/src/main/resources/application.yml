server:
  port: ${SERVER_PORT:8081}
  tomcat:
    max-part-count: 1100 # Up to 500 files plus 500 relativePaths fields.

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  application:
    name: transfer-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
      file-size-threshold: 0B
  cloud:
    openfeign:
      client:
        config:
          integrity-service:
            connectTimeout: ${INTEGRITY_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${INTEGRITY_READ_TIMEOUT_MS:30000}

aws:
  region: ${AWS_REGION:ap-southeast-1}

mmiv:
  auth:
    issuer: ${USER_ACCESS_JWT_ISSUER:https://auth.mmiv.example}
    jwk-set-uri: ${USER_ACCESS_JWK_SET_URI:http://localhost:8083/.well-known/jwks.json}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  integrity:
    max-attempts: ${INTEGRITY_MAX_ATTEMPTS:3}
    retry-delay-ms: ${INTEGRITY_RETRY_DELAY_MS:1000}
  cleanup:
    max-attempts: ${CLEANUP_MAX_ATTEMPTS:3}
    retry-delay-ms: ${CLEANUP_RETRY_DELAY_MS:1000}
  upload:
    max-size-bytes: 104857600
    folder:
      max-total-bytes: 104857600
      max-files: 500
  media:
    root: ${MMIV_MEDIA_ROOT:/media}
  s3:
    bucket: ${MMIV_BUCKET_NAME:media-migration-dev-landing}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# All services publish through the shared durable RabbitMQ outbox.
mmiv.events.enabled: ${MMIV_EVENTS_ENABLED:true}
mmiv.events.outbox-directory: ${MMIV_EVENTS_OUTBOX_DIRECTORY:./.mmiv-outbox}

mmiv.metadata.url: ${METADATA_URL:http://discovery-service:8085}
mmiv.access.url: ${USER_ACCESS_URL:http://user-access-service:8083}
mmiv.reporting.url: ${REPORTING_URL:http://reporting-service:8084}
mmiv.metadata.destination-id: ${MMIV_DESTINATION_ID:${MMIV_BUCKET_NAME:media-migration-dev-landing}}

mmiv.s3.endpoint: ${MMIV_S3_ENDPOINT:}
