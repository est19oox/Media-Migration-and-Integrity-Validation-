server:
  port: ${SERVER_PORT:8080}
spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    loadbalancer:
      cache:
        enabled: false # Eureka already maintains a discovery cache.
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false # Expose only the explicit routes below.
          httpclient:
            connect-timeout: 3000
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:300s}
          routes:
            - id: transfer-api
              uri: lb://transfer-service
              predicates:
                - Path=/api/v1/transfers,/api/v1/transfers/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 101MB
            - id: transfer-files
              uri: lb://transfer-service
              predicates:
                - Path=/api/v1/files,/api/v1/files/**
            - id: portal-api
              uri: lb://transfer-service
              predicates:
                - Path=/api/v1/portal/**
            - id: transfer-session
              uri: lb://transfer-service
              predicates:
                - Path=/api/v1/destinations,/api/v1/verification/**
            - id: home
              uri: forward:///pages/home.html
              predicates:
                - Path=/
            - id: legacy-login-redirect
              uri: no://op
              predicates:
                - Path=/login.html
              filters:
                - RedirectTo=302,/pages/login.html
            - id: legacy-signup-redirect
              uri: no://op
              predicates:
                - Path=/signup.html
              filters:
                - RedirectTo=302,/pages/signup.html
            - id: legacy-password-reset-redirect
              uri: no://op
              predicates:
                - Path=/reset-password.html
              filters:
                - RedirectTo=302,/pages/reset-password.html
            - id: legacy-invite-redirect
              uri: no://op
              predicates:
                - Path=/invite.html
              filters:
                - RedirectTo=302,/pages/invite.html
            - id: integrity-native-api
              uri: lb://integrity-service
              predicates:
                - Path=/api/integrity/**
            - id: integrity-api
              uri: lb://integrity-service
              predicates:
                - Path=/integrity/**
              filters:
                - StripPrefix=1
            - id: user-access-native-api
              uri: lb://user-access-service
              predicates:
                - Path=/api/access,/api/access/**
            - id: user-access-api
              uri: lb://user-access-service
              predicates:
                - Path=/user-access/**
              filters:
                - StripPrefix=1
            - id: reporting-api
              uri: lb://reporting-service
              predicates:
                - Path=/reporting/**
              filters:
                - StripPrefix=1
            - id: metadata-native-api
              uri: lb://discovery-service
              predicates:
                - Path=/api/metadata/**,/api/discovery/**
            - id: reports-native-api
              uri: lb://reporting-service
              predicates:
                - Path=/api/reports,/api/reports/**,/api/admin/reports,/api/admin/reports/**
            - id: reporting-read-api
              uri: lb://reporting-service
              predicates:
                - Path=/api/history,/api/dashboard
            - id: discovery-api
              uri: lb://discovery-service
              predicates:
                - Path=/discovery/**
              filters:
                - StripPrefix=1

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mmiv:
  auth:
    issuer: ${USER_ACCESS_JWT_ISSUER:https://auth.mmiv.example}
    jwk-set-uri: ${USER_ACCESS_JWK_SET_URI:http://user-access-service:8083/.well-known/jwks.json}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  events:
    enabled: ${MMIV_EVENTS_ENABLED:true}
    outbox-directory: ${MMIV_EVENTS_OUTBOX_DIRECTORY:./.mmiv-outbox}
