name: media-migration-database

services:
  oracle:
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/free:latest}
    container_name: media-migration-oracle
    restart: unless-stopped
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD or run the database setup script}
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
    name: media-migration-oracle-data
