<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a2a"/><stop offset="1" stop-color="#0f6a5a"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".06"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <!-- infinite loop -->
  <path d="M800 470 C 650 300, 330 300, 330 470 C 330 640, 650 640, 800 470 C 950 300, 1270 300, 1270 470 C 1270 640, 950 640, 800 470 Z" fill="none" stroke="#5be3b0" stroke-width="16" stroke-linecap="round"/>
  <path d="M1190 345 l60 40 l-70 20 Z" fill="#5be3b0"/>
  <path d="M410 595 l-60 -40 l70 -20 Z" fill="#5be3b0"/>
  <!-- two nodes: primary and standby -->
  <g stroke="#d6fff1" stroke-width="5" fill="#12413f">
    <rect x="230" y="410" width="200" height="120" rx="12"/><rect x="1170" y="410" width="200" height="120" rx="12"/>
  </g>
  <g fill="#5be3b0"><circle cx="270" cy="450" r="9"/><circle cx="1210" cy="450" r="9"/></g>
  <text x="330" y="580" fill="#d6fff1" font-size="30" text-anchor="middle" font-family="Segoe UI,Arial">PRIMARY</text>
  <text x="1270" y="580" fill="#d6fff1" font-size="30" text-anchor="middle" font-family="Segoe UI,Arial">STANDBY</text>
  <!-- uptime -->
  <text x="800" y="490" fill="#ffffff" font-size="84" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial">99.99%</text>
  <text x="800" y="540" fill="#d6fff1" font-size="28" text-anchor="middle" font-family="Segoe UI,Arial">UPTIME</text>
  <text x="800" y="150" fill="#ffffff" font-size="88" font-weight="700" text-anchor="middle" font-family="Segoe UI,Arial" letter-spacing="10">CONTINUITY</text>
</svg>
