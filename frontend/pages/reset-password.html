<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Change password · MMIV</title>

    <!-- Shared styles -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body class="reset-page">
    <!-- Particle background -->
    <div id="particles-js"></div>

    <!-- Background effects -->
    <div class="fx fx-glow"></div>

    <div class="fx fx-beam" style="top: 22%; transform: rotate(-4deg)"></div>

    <div
      class="fx fx-beam"
      style="top: 58%; height: 3px; opacity: 0.7; transform: rotate(-4deg)"
    ></div>

    <div
      class="fx fx-beam"
      style="top: 84%; height: 10px; opacity: 0.5; transform: rotate(-4deg)"
    ></div>

    <div
      class="fx fx-bokeh"
      style="left: 38%; top: 12%; width: 260px; height: 260px; background: rgba(0, 120, 212, 0.22)"
    ></div>

    <div
      class="fx fx-bokeh"
      style="left: 62%; top: 48%; width: 340px; height: 340px; background: rgba(120, 90, 255, 0.16)"
    ></div>

    <div
      class="fx fx-bokeh"
      style="left: 8%; top: 70%; width: 220px; height: 220px; background: rgba(0, 200, 200, 0.16)"
    ></div>

    <div
      class="fx fx-fore"
      style="
        left: -90px;
        bottom: -80px;
        width: 320px;
        height: 320px;
        background: rgba(0, 120, 212, 0.35);
      "
    ></div>

    <div
      class="fx fx-fore"
      style="
        right: -70px;
        top: -60px;
        width: 260px;
        height: 260px;
        background: rgba(120, 90, 255, 0.3);
      "
    ></div>

    <div
      class="fx fx-fore"
      style="
        left: 46%;
        bottom: -120px;
        width: 380px;
        height: 200px;
        background: rgba(255, 255, 255, 0.9);
      "
    ></div>

    <!-- MMIV branding -->
    <div class="mmiv-header">MMIV<span>.</span></div>

    <!-- Reset password card -->
    <div class="login-wrap">
      <main class="login-card reset-card">
        <h1>CHANGE PASSWORD</h1>

        <div class="sub">SET YOUR NEW PASSWORD</div>

        <p class="reset-description">
          Your administrator-issued link expires after one hour and can be used once.
        </p>

        <form id="resetForm">
          <div class="field">
            <label for="password"> New password </label>

            <input
              id="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <div class="field">
            <label for="confirm"> Confirm new password </label>

            <input id="confirm" type="password" autocomplete="new-password" required />
          </div>

          <button id="submit" type="submit">Change password</button>
        </form>

        <p id="status" role="status"></p>

        <div class="reset-back">
          <a href="login.html"> Back to sign in </a>
        </div>
      </main>
    </div>

    <script src="../js/feedback.js"></script>
    <script src="../js/particles.min.js"></script>
    <script src="../js/particles-effect.js"></script>
    <script src="../js/parallax-move.js"></script>
  </body>
</html>
